<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pay2GPT Connect</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <a class="brand" data-site href="https://pay2gpt.com/" target="_blank" rel="noopener">
      <img src="icons/icon48.png" alt="">
      <span>
        <span class="wm">Pay2<b>GPT</b></span>
        <span class="tag">Connect · ChatGPT</span>
      </span>
    </a>
    <a class="pill" data-site href="https://pay2gpt.com/" target="_blank" rel="noopener">
      <span data-host>pay2gpt.com</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </a>
  </header>

  <main class="body">
    <ol class="steps">
      <li class="step" id="s1"><span class="n">1</span><div><b data-i18n="s1"></b><span class="d" data-i18n="s1d"></span></div></li>
      <li class="step" id="s2"><span class="n">2</span><div><b data-i18n="s2"></b><span class="d" data-i18n="s2d"></span></div></li>
      <li class="step" id="s3"><span class="n">3</span><div><b data-i18n="s3"></b><span class="d" data-i18n="s3d"></span></div></li>
    </ol>

    <div class="status" id="status" role="status" aria-live="polite"><span class="icon" id="statusIcon"></span><span id="statusText"></span></div>

    <div class="key" id="key">
      <div class="key-head">
        <span class="key-label" data-i18n="keyLabel"></span>
        <button class="reveal" id="reveal" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="revealText" data-i18n="show"></span>
        </button>
      </div>
      <div class="key-value masked" id="keyValue"></div>
    </div>

    <button class="btn btn-white" id="get" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/></svg>
      <span id="getText" data-i18n="get"></span>
    </button>

    <div class="after" id="after">
      <button class="btn btn-brand" id="bot" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5L18 6.3c.4-.3-.1-.5-.6-.2L6.2 13.2 1.4 11.7c-1-.3-1-1 .2-1.5l18.9-7.3c.9-.3 1.6.2 1.4 1.4Z"/></svg>
        <span data-i18n="toBot"></span>
      </button>
      <button class="btn" id="download" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>
        <span data-i18n="download"></span>
      </button>
      <button class="btn btn-small" id="copy" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        <span id="copyText" data-i18n="copy"></span>
      </button>
    </div>

    <nav class="links">
      <a class="lnk" data-orders href="https://pay2gpt.com/orders" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        <span data-i18n="orders"></span>
      </a>
      <a class="lnk" href="https://t.me/Pay2GPT_support" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span data-i18n="support"></span>
      </a>
    </nav>

    <p class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3z"/><path d="m9 12 2 2 4-4"/></svg>
      <span data-i18n="note"></span>
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
